name: Keep Backend Alive

on:
  schedule:
    # Run every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Server
        run: |
          URL="${{ secrets.BACKEND_URL }}"
          if [ -z "$URL" ]; then
            echo "BACKEND_URL secret is not set. Please add BACKEND_URL in GitHub Repo Settings -> Secrets and variables -> Actions."
            exit 0
          fi
          echo "Pinging $URL/ping..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/ping" || true)
          echo "Response HTTP Status: $STATUS"
